[platformio]
; `pio run` and `pio run -t upload` act on this env only.
; The diagnostic is opt-in: pio run -e muxcheck -t upload
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
lib_deps = https://github.com/DFRobot/DFRobot_BMM350.git

; The streaming firmware.
[env:esp32dev]
build_src_filter = +<*>

; Bring-up diagnostic: pio run -e muxcheck -t upload
[env:muxcheck]
build_src_filter = -<*> +<../tools/mux_check/>
